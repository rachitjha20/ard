[project]
name = "ard"
version = "0.1.0"
description = "ARD - local-first document intelligence and PDF productivity platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "pikepdf>=9.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "psutil>=5.9",
    "platformdirs>=4.2",
    "typer>=0.12",
    "pyhanko>=0.25",
    "ocrmypdf>=16",
]

[project.scripts]
ard = "app.integrations.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
